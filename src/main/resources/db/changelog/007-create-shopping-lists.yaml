databaseChangeLog:
  - changeSet:
      id: 007-create-shopping-lists
      author: recipeplanner
      changes:
        - createTable:
            tableName: shopping_lists
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: ingredient_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: is_purchased
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: shopping_lists
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_shoppinglist_user
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: shopping_lists
            baseColumnNames: ingredient_id
            referencedTableName: ingredients
            referencedColumnNames: id
            constraintName: fk_shoppinglist_ingredient
