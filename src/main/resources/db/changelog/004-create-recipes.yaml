databaseChangeLog:
  - changeSet:
      id: 004-create-recipes
      author: recipeplanner
      changes:
        - createTable:
            tableName: recipes
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: instructions
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: cooking_time_minutes
                  type: INT
              - column:
                  name: servings
                  type: INT
              - column:
                  name: difficulty
                  type: VARCHAR(20)
              - column:
                  name: image_url
                  type: VARCHAR(500)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: author_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: BIGINT
        - addForeignKeyConstraint:
            baseTableName: recipes
            baseColumnNames: author_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_recipe_author
        - addForeignKeyConstraint:
            baseTableName: recipes
            baseColumnNames: category_id
            referencedTableName: categories
            referencedColumnNames: id
            constraintName: fk_recipe_category
