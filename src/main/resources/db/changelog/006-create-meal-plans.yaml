databaseChangeLog:
  - changeSet:
      id: 006-create-meal-plans
      author: recipeplanner
      changes:
        - createTable:
            tableName: meal_plans
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: recipe_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: planned_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: meal_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: servings
                  type: INT
                  defaultValueNumeric: 1
              - column:
                  name: notes
                  type: VARCHAR(500)
        - addForeignKeyConstraint:
            baseTableName: meal_plans
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_mealplan_user
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: meal_plans
            baseColumnNames: recipe_id
            referencedTableName: recipes
            referencedColumnNames: id
            constraintName: fk_mealplan_recipe
