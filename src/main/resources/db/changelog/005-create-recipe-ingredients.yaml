databaseChangeLog:
  - changeSet:
      id: 005-create-recipe-ingredients
      author: recipeplanner
      changes:
        - createTable:
            tableName: recipe_ingredients
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: recipe_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: ingredient_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: notes
                  type: VARCHAR(255)
        - addForeignKeyConstraint:
            baseTableName: recipe_ingredients
            baseColumnNames: recipe_id
            referencedTableName: recipes
            referencedColumnNames: id
            constraintName: fk_ri_recipe
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: recipe_ingredients
            baseColumnNames: ingredient_id
            referencedTableName: ingredients
            referencedColumnNames: id
            constraintName: fk_ri_ingredient
        - addUniqueConstraint:
            tableName: recipe_ingredients
            columnNames: recipe_id, ingredient_id
            constraintName: uq_recipe_ingredient
